<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro – Instituto Futuro Solidário</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="container">
      <div class="nav-main">
        <h1>Instituto Futuro Solidário</h1>
        <button class="menu-toggle" aria-label="Abrir menu" id="menuToggle">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav aria-label="Navegação principal" id="mainNav">
          <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Início</a></li>
            <li class="nav-item"><a href="projetos.html" class="nav-link">Projetos Sociais</a></li>
            <li class="nav-item"><a href="cadastro.html" class="nav-link active">Cadastro</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card" style="max-width: 700px; margin: var(--space-5) auto;">
      <div class="card-body">
        <h2 class="text-center">Cadastro de Voluntário</h2>
        <p class="text-center">Preencha o formulário abaixo para se juntar à nossa rede de solidariedade.</p>

        <form class="form-container" novalidate>
          <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" required>
          </div>

          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone (opcional)</label>
            <input type="tel" id="telefone" name="telefone">
          </div>

          <div class="form-group">
            <label for="interesse">Área de Interesse *</label>
            <select id="interesse" name="interesse" required>
              <option value="">Selecione...</option>
              <option value="educacao">Educação</option>
              <option value="alimentacao">Segurança Alimentar</option>
              <option value="eventos">Organização de Eventos</option>
              <option value="administracao">Apoio Administrativo</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="disponibilidade">Disponibilidade Semanal *</label>
            <select id="disponibilidade" name="disponibilidade" required>
              <option value="">Selecione...</option>
              <option value="manha">Manhã</option>
              <option value="tarde">Tarde</option>
              <option value="noite">Noite</option>
              <option value="fds">Finais de semana</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mensagem">Mensagem (opcional)</label>
            <textarea id="mensagem" name="mensagem" rows="4"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-large">Enviar Cadastro</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 Instituto Futuro Solidário. Todos os direitos reservados.</p>
        <p>CNPJ: 12.345.678/0001-90</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
